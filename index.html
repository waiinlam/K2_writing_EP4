<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畫大象鼻子 - 運筆練習 (撇)</title>
    <style>
        /* 基礎重置與防誤觸設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; /* 鎖定畫布，防止手機/平板滑動干擾 */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Comic Sans MS", "微軟正黑體", sans-serif;
            background: url('7.png') no-repeat center center;
            background-size: cover;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* 大象圖片與定位容器 */
        #elephant-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 85vh; 
            aspect-ratio: 3 / 4; /* 鎖定比例以確保座標不會因螢幕變形 */
            max-width: 95vw;
            pointer-events: none; /* 讓點擊事件穿透，交由 canvas 處理 */
        }

        #elephant {
            height: 100%;
            width: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; /* CSS 魔法：完美去除 JPG 的純白背景 */
        }

        /* SVG 安全道路路徑 (半透明引導線) */
        #guide-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 起點：大象雙眼中間 */
        #start-point {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: #ff4757;
            border: 4px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 6;
            /* 精準對準雙眼中間 */
            top: 48%; 
            left: 42%;
        }

        /* 終點：鼻子末端 (黃色閃爍光圈) */
        #end-point {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 234, 0, 0.4);
            border: 4px solid #ffd32a;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            /* 精準對準往左下捲的鼻子末端 */
            top: 62%; 
            left: 20%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ffd32a, inset 0 0 10px #ffd32a; transform: translate(-50%, -50%) scale(1); }
            100% { box-shadow: 0 0 30px #ff9f43, inset 0 0 20px #ff9f43; transform: translate(-50%, -50%) scale(1.15); }
        }

        /* 繪圖畫布 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* 進度星星 */
        #stars-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            font-size: 45px;
            color: #ccc;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .star.active {
            color: #ffd32a;
        }

        /* 獎勵動畫遮罩 */
        #reward-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #reward-screen.show {
            opacity: 1;
        }

        #reward-text {
            font-size: 6vw;
            color: #ff4757;
            font-weight: bold;
            text-shadow: 3px 3px 0 #fff, 5px 5px 10px rgba(0,0,0,0.2);
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #reward-screen.show #reward-text {
            transform: scale(1);
        }

        @media (max-width: 768px) {
            #reward-text { font-size: 10vw; }
            #stars-container { font-size: 35px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 左上角進度 -->
        <div id="stars-container">
            <span class="star" id="star-1">★</span>
            <span class="star" id="star-2">★</span>
            <span class="star" id="star-3">★</span>
            <span class="star" id="star-4">★</span>
            <span class="star" id="star-5">★</span>
        </div>

        <canvas id="drawing-canvas"></canvas>

        <div id="elephant-wrapper">
            <!-- 繼續使用原本的 JPG，CSS 會自動處理白底 -->
            <img id="elephant" src="9.jpg" alt="大象">
            
            <!-- 半透明安全道路路徑 (SVG) -->
            <svg id="guide-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <!-- 粗的半透明白色底層道路 -->
                <path d="M 42 48 Q 33 58 20 62" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="6" stroke-linecap="round" />
                <!-- 中間的黃色虛線引導線 -->
                <path d="M 42 48 Q 33 58 20 62" fill="none" stroke="#ffd32a" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" />
            </svg>

            <!-- 修正後的起點與終點 -->
            <div id="start-point"></div>
            <div id="end-point"></div>
        </div>

        <!-- 獎勵畫面 -->
        <div id="reward-screen">
            <div id="reward-text">✨ 你真努力！</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const startElement = document.getElementById('start-point');
        const endElement = document.getElementById('end-point');
        const rewardScreen = document.getElementById('reward-screen');
        const rewardText = document.getElementById('reward-text');

        let isDrawing = false;
        let progress = 0;
        const maxProgress = 5;
        
        // K2 小朋友操作容錯範圍 (像素)
        const hitRadius = 80; 

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 設定畫筆樣式：粗且柔和的藍色，能剛好蓋過路徑引導線
            ctx.lineWidth = 26; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#4a69bd'; 
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getCenter(el) {
            const rect = el.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        function getDistance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (progress >= maxProgress) return;

            const startPos = getCenter(startElement);
            const dist = getDistance(e.clientX, e.clientY, startPos.x, startPos.y);

            if (dist < hitRadius) {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(startPos.x, startPos.y);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            const endPos = getCenter(endElement);
            const dist = getDistance(e.clientX, e.clientY, endPos.x, endPos.y);

            // 成功條件：鬆開手時的位置在終點光圈附近
            if (dist < hitRadius) {
                handleSuccess();
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        canvas.addEventListener('pointercancel', () => {
            if (isDrawing) {
                isDrawing = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        function handleSuccess() {
            progress++;
            document.getElementById(`star-${progress}`).classList.add('active');

            if (progress >= maxProgress) {
                rewardText.innerText = "🎉 太棒了！全部完成！";
                rewardScreen.classList.add('show');
            } else {
                rewardText.innerText = "✨ 你真努力！";
                rewardScreen.classList.add('show');
                
                setTimeout(() => {
                    rewardScreen.classList.remove('show');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 1500);
            }
        }
    </script>
</body>
</html>
