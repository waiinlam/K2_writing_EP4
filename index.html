<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畫大象鼻子 - 運筆練習 (撇)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; 
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Comic Sans MS", "微軟正黑體", sans-serif;
            background: url('7.png') no-repeat center center;
            background-size: cover;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* 大象圖片與定位容器 */
        #elephant-wrapper {
            position: absolute;
            top: 62%; 
            left: 50%;
            transform: translate(-50%, -50%);
            height: 85vh; 
            aspect-ratio: 3 / 4; 
            max-width: 95vw;
            pointer-events: none; 
        }

        #elephant {
            height: 100%;
            width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        #guide-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 🟢 修正：起點稍微向下微調，維持在兩眉之間 */
        #start-point {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: #ff4757;
            border: 4px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 6;
            top: 42%; /* 由 38% 微調至 42% */
            left: 44%;
        }

        /* 終點：鼻子末端 */
        #end-point {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 234, 0, 0.4);
            border: 4px solid #ffd32a;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            top: 60%; 
            left: 22%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ffd32a, inset 0 0 10px #ffd32a; transform: translate(-50%, -50%) scale(1); }
            100% { box-shadow: 0 0 30px #ff9f43, inset 0 0 20px #ff9f43; transform: translate(-50%, -50%) scale(1.15); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #stars-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            font-size: 45px;
            color: #ccc;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .star.active {
            color: #ffd32a;
        }

        #reward-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.9);
            z-index: 30;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #reward-screen.show {
            opacity: 1;
            pointer-events: auto; 
        }

        #reward-text {
            font-size: 6vw;
            color: #ff4757;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            text-shadow: 3px 3px 0 #fff, 5px 5px 10px rgba(0,0,0,0.2);
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #reward-screen.show #reward-text {
            transform: scale(1);
        }

        #restart-btn {
            display: none; 
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 28px;
            font-family: "Comic Sans MS", "微軟正黑體", sans-serif;
            font-weight: bold;
            color: white;
            background-color: #4cd137;
            border: 4px solid #fff;
            border-radius: 50px;
            box-shadow: 0 6px 0 #44bd32, 0 10px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }

        #restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #44bd32, 0 4px 6px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            #reward-text { font-size: 12vw; }
            #stars-container { font-size: 35px; }
            #restart-btn { font-size: 24px; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="stars-container">
            <span class="star" id="star-1">★</span>
            <span class="star" id="star-2">★</span>
            <span class="star" id="star-3">★</span>
            <span class="star" id="star-4">★</span>
            <span class="star" id="star-5">★</span>
        </div>

        <canvas id="drawing-canvas"></canvas>

        <div id="elephant-wrapper">
            <!-- 🟢 更新：使用你自己準備好的 9new.png -->
            <img id="elephant" src="9new.png" alt="大象">
            
            <svg id="guide-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <!-- 🟢 修正：引導線的起點 M 配合紅點稍微拉低 (由 38 改為 42) -->
                <path d="M 44 42 C 43 55, 32 65, 22 60" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="6" stroke-linecap="round" />
                <path d="M 44 42 C 43 55, 32 65, 22 60" fill="none" stroke="#ffd32a" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" />
            </svg>

            <div id="start-point"></div>
            <div id="end-point"></div>
        </div>

        <div id="reward-screen">
            <div id="reward-text">✨ 你真努力！</div>
            <button id="restart-btn">再玩一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const startElement = document.getElementById('start-point');
        const endElement = document.getElementById('end-point');
        const rewardScreen = document.getElementById('reward-screen');
        const rewardText = document.getElementById('reward-text');
        const restartBtn = document.getElementById('restart-btn');

        let isDrawing = false;
        let progress = 0;
        const maxProgress = 5;
        
        const hitRadius = 80; 

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            ctx.lineWidth = 26; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#4a69bd'; 
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getCenter(el) {
            const rect = el.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        function getDistance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (progress >= maxProgress) return;

            const startPos = getCenter(startElement);
            const dist = getDistance(e.clientX, e.clientY, startPos.x, startPos.y);

            if (dist < hitRadius) {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(startPos.x, startPos.y);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            const endPos = getCenter(endElement);
            const dist = getDistance(e.clientX, e.clientY, endPos.x, endPos.y);

            if (dist < hitRadius) {
                handleSuccess();
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        canvas.addEventListener('pointercancel', () => {
            if (isDrawing) {
                isDrawing = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        function handleSuccess() {
            progress++;
            document.getElementById(`star-${progress}`).classList.add('active');

            if (progress >= maxProgress) {
                rewardText.innerText = "欣賞你！真努力！";
                restartBtn.style.display = 'block';
                rewardScreen.classList.add('show');
            } else {
                rewardText.innerText = "✨ 好棒！";
                rewardScreen.classList.add('show');
                
                setTimeout(() => {
                    rewardScreen.classList.remove('show');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 1500);
            }
        }

        restartBtn.addEventListener('click', () => {
            progress = 0;
            document.querySelectorAll('.star').forEach(star => {
                star.classList.remove('active');
            });
            rewardScreen.classList.remove('show');
            restartBtn.style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
